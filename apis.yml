aid: ai-clearing
name: AI Clearing
description: 'AI Clearing is an AI-native construction progress tracking and quality
  control company founded in 2020, headquartered in Austin, Texas with an R&D center
  in Warsaw, Poland. Its CORE platform ingests drone imagery, ground-level mobile
  capture, CAD/BIM models and project schedules (including Primavera P6) and returns
  automated progress, productivity and quality analytics through interactive
  dashboards, a 3D digital twin and an agentic assistant (Clara), serving contractors
  and asset owners across solar, pipelines, transmission, highways, railways and
  airports. As of this profiling round the company publishes no public developer
  program, API reference or machine-readable contract: the CORE application at
  core.aiclearing.com is a customer-only single-page app behind a Cloudflare bot
  challenge, and docs.aiclearing.com does not answer public requests.'
